[project]
name = "pentaday"
version = "1.1.0"
description = "Pentaday: a calendar pentomino puzzle, with a game and an exact-cover solver"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["plotly>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["pentaday"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["pentaday"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take more than ~2 s (deselect with -m 'not slow')"]
