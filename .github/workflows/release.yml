name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create, e.g. v1.1.0"
        required: true
      ref:
        description: "Commit SHA or branch to tag"
        required: true
        default: main
      replace:
        description: "Delete an existing release and tag with this version first"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            if [ "$REPLACE" != "true" ]; then
              echo "Release $VERSION already exists"
              exit 0
            fi
            gh release delete "$VERSION" --cleanup-tag --yes
          fi
          gh release create "$VERSION" --target "$(git rev-parse HEAD)" --title "$VERSION" --generate-notes
